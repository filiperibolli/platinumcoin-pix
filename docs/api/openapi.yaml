openapi: 3.0.3
info:
  title: PlatinumCoin PIX Platform API
  version: 1.0.0
  description: |
    Public REST contract of the Pix platform. Conventions:
    - All endpoints (except /auth/login) require `Authorization: Bearer <JWT>`.
    - The **debited account is always derived from the JWT** (`accountId` claim); it is never accepted in any request body.
    - Money in request/response bodies is a decimal string in BRL (e.g. "125.50"); stored internally as integer cents.
    - `POST /payments/pix` is asynchronous: `202 Accepted` means "accepted for processing", not settled.
    - Errors follow RFC 7807 (application/problem+json).
    - There is no API gateway in the local build: each path group is served by its own service
      (per-path `servers` overrides below) — auth :8081, pix-keys :8082, payments/accounts :8084,
      notifications :8087. The default server is payment-service.

servers:
  - url: http://localhost:8084/v1
    description: payment-service (local)
  - url: http://localhost:8082/v1
    description: account-service (local)
  - url: http://localhost:8081/v1
    description: auth-service (local)

tags:
  - name: auth
  - name: payments
  - name: accounts
  - name: pix-keys
  - name: notifications

paths:
  /auth/login:
    servers:
      - url: http://localhost:8081/v1
        description: auth-service (local)
    post:
      tags: [auth]
      summary: Authenticate and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: alice }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    servers:
      - url: http://localhost:8081/v1
        description: auth-service (local)
    get:
      tags: [auth]
      summary: Return the caller identity carried by the bearer token
      description: |
        Echoes the identity the platform derived from the validated JWT — `userId` (the token
        subject) and `accountId` (the `accountId` claim). Proves the shared common-lib
        `JwtAuthFilter` is enforcing auth: reaching this endpoint at all means the token passed
        validation. There is no way to name a different account — the identity comes only from the
        token, which is the same mechanism money-moving flows use to pick the debited account.
      responses:
        '200':
          description: The authenticated caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, example: u-alice }
                  accountId: { type: string, example: acc-001 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/pix:
    post:
      tags: [payments]
      summary: Send a Pix (asynchronous)
      description: |
        Validates limits and fraud, atomically debits the payer (double-entry against the
        clearing account) and enqueues settlement with BACEN SPI. Returns immediately with
        `202 Accepted`; final state arrives via SSE notification or status polling.

        **Idempotency:** the `Idempotency-Key` header is REQUIRED. Retrying with the same
        key and the same body replays the original response (same transactionId). The same
        key with a different body returns `409 Conflict`. Keys are scoped to the
        authenticated account and expire after 24h.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pixKey, amount]
              properties:
                pixKey:
                  type: string
                  description: Destination Pix key (CPF, e-mail, phone or random key — EVP)
                  example: bob@otherbank.com
                amount:
                  type: string
                  pattern: '^\d{1,9}\.\d{2}$'
                  description: >-
                    Decimal string in BRL, strictly positive — "0.00" is rejected with 400
                    (server-side check; the pattern alone cannot express it). At most 9 integer
                    digits, comfortably inside 64-bit integer cents.
                  example: "125.50"
                description:
                  type: string
                  maxLength: 140
      responses:
        '202':
          description: Accepted for processing
          headers:
            Location:
              schema: { type: string }
              description: URL to poll for status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            IDEMPOTENCY_KEY_REUSED — the same key was replayed with a different payload;
            REQUEST_IN_PROGRESS — a concurrent request with this key is still in flight (carries Retry-After, the operation may still succeed);
            OPERATION_UNRESOLVED — the key names a money operation that never resolved and cannot be safely resumed (ADR-0014). NO Retry-After: it will not resolve on its own and needs an operator, so retrying is futile. Use a new Idempotency-Key only after confirming with support whether the original payment moved money.
          headers:
            Retry-After:
              schema: { type: integer, example: 2 }
              description: Present on REQUEST_IN_PROGRESS only
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Business rejection (LIMIT_EXCEEDED, INSUFFICIENT_FUNDS, FRAUD_DENIED, KEY_NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Ledger unavailable — retry with the SAME Idempotency-Key
          headers:
            Retry-After: { schema: { type: integer, example: 5 } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /payments/{transactionId}:
    get:
      tags: [payments]
      summary: Query payment status
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/me:
    servers:
      - url: http://localhost:8082/v1
        description: account-service (local)
    get:
      tags: [accounts]
      summary: The authenticated caller's own account
      description: |
        Returns the caller's account, derived **only** from the JWT (`accountId` claim) — there is no
        path or body parameter that could name a different account, the same mechanism that protects
        the debited account in the send flow. Served by account-service (8082), distinct from the
        cache-backed `/accounts/me/balance` and `/accounts/me/statement` reads (payment-service, 8084).
        The internal service-to-service lookup `GET /internal/accounts/{accountId}` is intentionally
        not part of this public contract.
      responses:
        '200':
          description: The caller's account
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string, example: acc-001 }
                  status: { type: string, example: ACTIVE }
                  dailyLimit:
                    type: string
                    description: Daily Pix limit as a decimal BRL string (stored internally as integer cents)
                    example: "5000.00"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/me/balance:
    get:
      tags: [accounts]
      summary: Current balance (cache-backed, <300ms p99)
      description: |
        The caller's balance, derived **only** from the JWT (`accountId` claim) — there is no path or
        body parameter that could name another account. Served by payment-service (8084), which owns
        the ledger seam and the cache in front of it.

        **Cache-aside with a 5s TTL** (ADR-0008): a hit is served from Redis; a miss reads
        ledger-service's strongly-consistent balance and populates the cache. Every ledger posting
        deletes the affected keys after it commits, so the value can be **at most ~5s stale** — which
        `asOf` reports explicitly. The staleness is safe by construction: **no money decision reads
        this value**; the `balance >= amount` guard is a condition expression inside the ledger's
        atomic write, so a stale cache can never authorize an overdraft.
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string, example: acc-001 }
                  balance: { type: string, example: "874.50" }
                  currency: { type: string, example: BRL }
                  asOf:
                    type: string
                    format: date-time
                    description: >-
                      When the ledger was read for this value — not the time of the response. A cached
                      answer keeps the instant it was cached with, so a client can tell how old the
                      number is.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            `BALANCE_NOT_FOUND` — the ledger holds no balance for the caller's account. Deliberately
            not a 200 with zero: "no such account" and "no money" are different facts.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: >-
            `LEDGER_UNAVAILABLE` — the balance was not in the cache and ledger-service could not be
            reached. Carries `Retry-After`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /accounts/me/statement:
    get:
      tags: [accounts]
      summary: Paginated statement (newest first)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor from previous page (base64 LastEvaluatedKey)
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: One page of ledger entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/StatementEntry' }
                  nextCursor:
                    type: string
                    nullable: true

  /notifications/stream:
    servers:
      - url: http://localhost:8087/v1
        description: notification-service (local)
    get:
      tags: [notifications]
      summary: Real-time notification stream (SSE)
      description: >-
        Long-lived Server-Sent Events stream for the authenticated user. Pushes
        PixSettled/PixReversed to the sender and PixReceived to the receiver, using the
        same external status vocabulary as `GET /payments/{transactionId}`. Heartbeat
        comments keep the connection alive; clients should auto-reconnect (native
        EventSource behavior). A missed push never affects correctness — state remains
        queryable via the status endpoint.


        Each frame carries its routing in SSE's own fields: `event:` is the event type
        (so a browser can `addEventListener('PixReceived', …)` without parsing the body)
        and `id:` is the `eventId` (so a reconnect resumes via `Last-Event-ID`). Lines
        beginning with `:` are comments — the handshake (`:connected …`) and the 25s
        keepalive (`:ping`) — which every client, EventSource included, ignores.


        The stream is always the caller's own: the account comes from the JWT `accountId`
        claim and no parameter names an account.
      parameters:
        - name: access_token
          in: query
          required: false
          schema: { type: string }
          description: >-
            Alternative to the `Authorization` header, for clients that cannot set request
            headers — notably the browser's native `EventSource`, which has no API for it.
            **Accepted on this path only**, and it is a convenience, not a second verifier:
            notification-service rewrites it into an `Authorization: Bearer` header before
            the shared JWT filter runs, so an invalid token yields the identical 401. An
            explicit `Authorization` header always takes precedence. Note the trade-off — a
            token in a URL reaches access logs, `Referer` and browser history; the production
            posture is a short-lived single-use stream ticket.
      responses:
        '200':
          description: >-
            Open event stream. Each event is three lines — `event:` (the type), `id:` (the
            `eventId`) and `data:` (a `Notification`, below). Lines starting with `:` are
            comments: the handshake (`:connected …`) and the 25s keepalive (`:ping`).
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE frames; every `data:` line is one
                  [`Notification`](#/components/schemas/Notification) object — the same
                  shape for all three event types.
              examples:
                pixSettled:
                  summary: The payer's external send settled
                  value: |
                    event:PixSettled
                    id:evt-6f1a...
                    data:{"transactionId":"tx-8f2c","type":"PixSettled","status":"SETTLED","amount":"987.00","counterpart":"bob@otherbank.com","timestamp":"2026-08-20T10:15:00Z","failureReason":null}
                pixReceived:
                  summary: Money arrived for the payee
                  value: |
                    event:PixReceived
                    id:evt-91bd...
                    data:{"transactionId":"in-E9999...","type":"PixReceived","status":"SETTLED","amount":"42.42","counterpart":"Carol","timestamp":"2026-08-20T10:16:00Z","failureReason":null}
                pixReversed:
                  summary: BACEN refused; the money is back with the payer
                  value: |
                    event:PixReversed
                    id:evt-0c47...
                    data:{"transactionId":"tx-8f2c","type":"PixReversed","status":"REVERSED","amount":"125.50","counterpart":"bob@otherbank.com","timestamp":"2026-08-20T10:15:02Z","failureReason":"CREDITOR_KEY_NOT_IN_DICT"}
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pix-keys:
    servers:
      - url: http://localhost:8082/v1
        description: account-service (local)
    post:
      tags: [pix-keys]
      summary: Register a Pix key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyType, keyValue]
              properties:
                keyType: { type: string, enum: [CPF, EMAIL, PHONE, EVP] }
                keyValue: { type: string, description: "Ignored for EVP (server-generated UUID)" }
      responses:
        '201':
          description: Key registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixKey' }
        '409':
          description: Key already registered (globally unique)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [pix-keys]
      summary: List my Pix keys
      responses:
        '200':
          description: Keys of the authenticated account
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PixKey' }

  /pix-keys/{keyValue}:
    servers:
      - url: http://localhost:8082/v1
        description: account-service (local)
    delete:
      tags: [pix-keys]
      summary: Delete a Pix key (must belong to the authenticated account)
      parameters:
        - name: keyValue
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '403':
          description: >-
            Key belongs to another account. Deliberately 403 (not 404): Pix keys are
            globally resolvable identifiers, so their existence is not secret — unlike
            payments, where a foreign transactionId returns 404 to avoid leaking existence.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Client-generated UUID, one per business operation; reuse it on retries.
  schemas:
    PaymentAccepted:
      type: object
      properties:
        transactionId: { type: string, example: tx-9f1c }
        endToEndId: { type: string, example: E12345678202607021234abcdef01234 }
        status: { type: string, example: PROCESSING }
    Payment:
      type: object
      properties:
        transactionId: { type: string }
        endToEndId: { type: string }
        status:
          type: string
          enum: [PROCESSING, SETTLED, FAILED, REVERSED, REJECTED]
          description: External view of the internal state machine
        amount: { type: string }
        pixKey: { type: string }
        createdAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }
        failureReason:
          type: string
          nullable: true
          description: >-
            Set on `REVERSED` — BACEN's refusal reason, forwarded as settlement-service stored
            it (step 33). `null` on every other status. Carries the same value as the
            `Notification.failureReason` pushed for the same payment, including the same
            known gap: what travels today is the SPI's `detail` sentence rather than its
            machine-readable code.
          example: CREDITOR_KEY_NOT_IN_DICT
    Notification:
      type: object
      description: >-
        One `data:` line of the SSE stream (step 39). Deliberately a subset of `Payment`,
        field for field: a client that already parses the status endpoint parses this with
        no new vocabulary — same `status` enum, same `amount` formatting, same nullable
        `failureReason`. Every field is always present (`null` when it does not apply), so
        the shape never changes under a client that has parsed one frame.


        No account id travels: the stream is opened with a JWT and carries only that
        caller's events, so naming the account would restate what the client knows.


        `counterpart` is **not masked here**, unlike `StatementEntry.counterpart` — a push
        is ephemeral, authenticated and about the caller's own payment, and on a send it is
        the very key the payer typed. A statement is exportable and long-lived, which is
        what earns it the masking.
      properties:
        transactionId: { type: string, example: tx-9f1c }
        type:
          type: string
          enum: [PixSettled, PixReceived, PixReversed]
          description: >-
            The event, and also the frame's `event:` field — a browser can
            `addEventListener('PixReceived', …)` without parsing this body. It is what
            carries the direction, which is why an arrival needs no status of its own.
        status:
          type: string
          enum: [SETTLED, REVERSED]
          description: >-
            The same external vocabulary `Payment.status` uses. An arrival is `SETTLED`:
            the money is here and it is final.
        amount:
          type: string
          example: "987.00"
          description: Integer cents formatted at this edge and nowhere earlier
        counterpart:
          type: string
          nullable: true
          description: >-
            The payee's Pix key on a send, the payer's name (or their ISPB when BACEN sent
            no name) on an arrival. `null` when neither travelled — never an internal
            account id.
          example: bob@otherbank.com
        timestamp:
          type: string
          format: date-time
          description: >-
            When the money reached this outcome — BACEN's `settledAt` on a settlement, the
            arrival instant on a receive — not when the platform announced it.
        failureReason:
          type: string
          nullable: true
          description: >-
            Set only on `PixReversed`, forwarded verbatim from the reversal event.


            **Known gap (found verifying step 39, introduced in step 33):** what actually
            travels today is not a code but the SPI's problem+json `detail` sentence —
            e.g. `"The SPI refused the settlement: SETTLEMENT_REJECTED_BY_ADMIN |
            endToEndId=E1234…"` — because `HttpSpiSettlementClient` reads `detail` rather
            than the machine-readable `code` the SPI also returns. It reached a customer's
            screen for the first time in step 39, which is how it surfaced. Treat this
            field as opaque display text until the producer is fixed; the intended shape
            is the code alone (`SETTLEMENT_REJECTED_BY_ADMIN`,
            `CREDITOR_KEY_NOT_IN_DICT`), which is a settlement-service change, not a
            notification one.
          example: CREDITOR_KEY_NOT_IN_DICT
    StatementEntry:
      type: object
      properties:
        txId: { type: string }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amount:
          type: string
          example: "-125.50"
          description: Signed decimal BRL string — negative on a DEBIT, positive on a CREDIT
        counterpart:
          type: string
          description: >-
            A partial mask over the counterpart's internal account id (never the id itself, step 41) —
            a short prefix and suffix around a fixed "***". This is the raw ledger account id, not a
            Pix key or a display name: resolving the counterpart's Pix key/name is a call to
            account-service this endpoint does not make.
          example: "acc***01"
        timestamp: { type: string, format: date-time }
    PixKey:
      type: object
      properties:
        keyType: { type: string }
        keyValue: { type: string }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, example: LIMIT_EXCEEDED }
        correlationId: { type: string }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

security:
  - bearerAuth: []
