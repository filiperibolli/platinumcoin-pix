name: CI

# Runs the full test suite on every push and PR to main: `mvn verify` over the whole reactor, unit
# tests and Testcontainers integration tests alike, on the JDK the project targets.
#
# WHAT THIS JOB DOES NOT RUN, on purpose. `tests/e2e` is not in the default reactor (it needs the
# `-Pe2e` profile) because it drives the RUNNING docker-compose stack and spends several minutes in
# real failure drills — see tests/e2e/README.md. So a green badge here means "every hermetic test
# passes", not "the journey was exercised". Running the compose stack in CI is a real option and a
# deliberate non-goal for now; the journey is run by hand and by `mvn -Pe2e -pl tests/e2e -am verify`.
#
# The Docker Engine API version the Testcontainers harness needs is pinned in the parent POM
# (`docker.api.version`), never passed on the command line — docs/local-dev.md §6.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & verify (unit + Testcontainers IT)
        run: mvn -B --no-transfer-progress verify
