server:
  port: 8086

spring:
  application:
    name: settlement-service

# Local-dev CORS, arriving with this service's first HTTP endpoint (step 37) so the open-from-disk API
# explorer (tools/api-explorer/index.html, Origin: null) can exercise the inbound webhook — including its
# 401 — from the browser. Permissive + credential-free by design; the CorsFilter is ordered ahead of the
# JWT filter so pre-flights aren't 401'd. See infra/config/CorsConfig.
web:
  cors:
    allowed-origin-patterns: "*"

# The JWT config is required even though this service authenticates nothing with a token: common-lib
# auto-configures the shared JwtAuthFilter for every servlet service, and the platform keeps ONE
# authentication posture rather than a per-service opt-out. The secret must match auth-service's;
# public-paths is the allow-list the filter skips.
#
# /v1/inbound/** is on that allow-list because BACEN holds no PlatinumCoin token — a real participant
# authenticates to the SPI with mTLS and an ICP-Brasil certificate (ADR-0007), a whole trust domain away
# from our HS256 tokens. JWT-exempt is NOT anonymous: the route credits money, so it is guarded by the
# shared pix.inbound.webhook-token below, checked inside the use case before anything else happens
# (threat model, boundary B4).
jwt:
  secret: ${JWT_SECRET:dev-only-hs256-secret-change-me-please-32b}
  public-paths:
    - /actuator/**
    - /v1/inbound/**
  # Workload identity (step 68, ADR-0017). settlement-service runs off a queue and has no user token
  # to forward even if it wanted to, so it has minted its own since step 33 — this step moves that
  # issuer to common-lib and adds the typ/aud/scope claims that make it checkable rather than merely
  # conventional.
  service-name: settlement-service
  service-token-ttl: ${SERVICE_TOKEN_TTL_SECONDS:60}s

# Pix participant identifier (ISPB — 8 digits), sent to the rail as the debtor participant. Same value
# payment-service bakes into every endToEndId; one place to change PlatinumCoin's participant code.
pix:
  ispb: ${PIX_ISPB:12345678}
  # Where an EXTERNAL send parks the money it debits (step 27) and, symmetrically, where an INBOUND Pix
  # draws the money it credits from (step 37). It MUST be the same id payment-service uses — both
  # directions net against one clearing balance, and step 52 shards it into SPI_CLEARING#00..#15, which is
  # exactly why it is configuration in both services rather than a constant in either.
  clearing-account-id: ${PIX_CLEARING_ACCOUNT_ID:SPI_CLEARING}
  inbound:
    # The shared secret BACEN presents on POST /v1/inbound/pix as X-Webhook-Token. The route is JWT-exempt
    # (an external party holds no PlatinumCoin token) but it CREDITS MONEY, so it is never anonymous: an
    # unauthenticated inbound webhook would let any process that can reach this port mint spendable
    # balance (threat model, boundary B4). A sandbox stand-in — production is mTLS + BACEN message
    # signing. Empty by default ON PURPOSE: a service with no token configured refuses every delivery
    # rather than accepting an empty header, so a misconfiguration fails closed.
    webhook-token: ${SPI_WEBHOOK_TOKEN:}
  settlement:
    # The ledger account a CLEARING_RELEASE credits when an external send settles (step 33): money that
    # has left the bank to the SPI network. Seeded at 0 by infra/localstack/init/05-seed-ledger.sh.
    settled-account-id: ${PIX_SETTLED_ACCOUNT_ID:SPI_SETTLED}
    # The queue this service consumes (created by infra/localstack/init/06-messaging-core.sh, subscribed
    # to pix-events with a filter policy of eventType=PixDebited). Resolved to its URL at startup —
    # booting healthy while consuming nothing would be the worst possible failure mode.
    queue-name: ${SETTLEMENT_QUEUE_NAME:settlement-queue}
    # The dead-letter queue this service's redrive policy targets (step 26). It consumes nothing from it;
    # it only measures its depth as the pix.settlement.dlq.depth metric (step 32) — a non-zero, sustained
    # depth means money is stuck in clearing with no automatic path releasing it (step 44 alerts on it).
    dlq:
      queue-name: ${SETTLEMENT_DLQ_NAME:settlement-queue-dlq}
      # How often the depth gauge is refreshed via GetQueueAttributes. 15s is far finer than the minutes
      # an alert on "stuck money" reacts in, and one cheap attribute read is negligible.
      metric-refresh-ms: ${SETTLEMENT_DLQ_REFRESH_MS:15000}
    consumer:
      # How long a receive blocks waiting for work. 20s is the SQS maximum and matches the queue's own
      # ReceiveMessageWaitTimeSeconds: an idle system costs one request per 20s instead of a stream of
      # empty ones, and a message that arrives is picked up in milliseconds.
      wait-time-seconds: ${SETTLEMENT_WAIT_TIME_SECONDS:20}
      # Messages per receive (SQS maximum is 10). They are handled sequentially, so this bounds how long
      # one tick can hold messages invisible: 10 × 12s worst case is far past the 30s visibility timeout,
      # which is exactly what step 32 has to fix (batch size, visibility extension, or both).
      batch-size: ${SETTLEMENT_BATCH_SIZE:5}
      # Gap between polls. Small because the long poll already does the waiting; fixedDelay, so a slow
      # batch never overlaps the next tick.
      fixed-delay-ms: ${SETTLEMENT_CONSUMER_DELAY_MS:500}
      # Per-attempt retry backoff (step 32): on a rail failure the message is left on the queue and its
      # visibility reset to base·2^(receiveCount-1), capped. Defaults give 5,10,20,40,60(cap)s across the
      # five deliveries before the DLQ — quick retries first, further apart the longer an id keeps
      # failing. ITs set the base to 0 for immediate redelivery so a retry drill does not wait on time.
      retry-backoff-base-seconds: ${SETTLEMENT_RETRY_BACKOFF_BASE_SECONDS:5}
      retry-backoff-cap-seconds: ${SETTLEMENT_RETRY_BACKOFF_CAP_SECONDS:60}
    # The stuck-transaction scanner (step 34): a scheduled GSI2 query for external sends parked too long in
    # DEBITED/SENT_TO_SPI, feeding them to the reconciliation path and reporting the oldest age as the
    # pix.reconciliation.oldest.seconds gauge.
    reconciliation:
      # How often the scan runs. 60s is far finer than the 5-min SLO it protects (ADR-0003), and one bounded
      # GSI2 query per status is cheap. fixedDelay, so a slow scan never overlaps the next.
      scan-fixed-delay-ms: ${RECONCILIATION_SCAN_DELAY_MS:60000}
      # How long a transaction may sit in DEBITED/SENT_TO_SPI before it is considered stuck. 2 minutes: a
      # healthy settlement walks it to SETTLED/REVERSED in seconds, and BACEN's own budget is up to 10s
      # (ADR-0003), so 2 minutes is well past any legitimate in-flight time yet leaves ample room inside the
      # 5-min resolution SLO.
      stuck-after-seconds: ${RECONCILIATION_STUCK_AFTER_SECONDS:120}
      # The per-tick bound: the most stuck transactions one scan (per status) reads. A backlog larger than
      # this drains over successive ticks rather than blowing up a single tick. Oldest-first, so the ones
      # nearest the SLO breach are always picked first.
      max-per-tick: ${RECONCILIATION_MAX_PER_TICK:200}
      # How old a transaction the rail reports UNKNOWN (no record) must be before the resolver reverses it
      # (step 35). It sits past the 120s stuck threshold on purpose: a rail that has no record could still
      # have a POST in flight, and reversing the instant we notice UNKNOWN could race a settle into moving
      # money twice (the -rev and -rel postings have different txIds, so posting idempotency does not cover
      # them). 240s is comfortably past the 12s SPI timeout + retry backoff + DLQ threshold, yet inside the
      # 5-min SLO. FAILED (a definitive refusal) reverses immediately and ignores this window.
      reverse-safety-window-seconds: ${RECONCILIATION_REVERSE_SAFETY_WINDOW_SECONDS:240}
      # The <5-min reconciliation SLO breach threshold (ADR-0003): pix.reconciliation.oldest.seconds above this
      # fires the in-code SLO alert (step 35) and, from step 44, the Prometheus alert on the same gauge —
      # one number, so the code and the dashboard never disagree on what "late" means.
      slo-breach-seconds: ${RECONCILIATION_SLO_BREACH_SECONDS:300}
    # The platform alert watchdog (step 44, task 4). settlement-service hosts it because the rule that
    # matters most — "debits are flowing but nothing is settling" — is a statement about the pipeline this
    # service terminates, and because it already owns the reconciliation SLO alert and the DLQ probe.
    # Half the rules read metrics OTHER services publish, so the watchdog queries Prometheus rather than
    # its own registry: that is the only vantage point from which a cross-service question can be asked.
    # A Prometheus that is down degrades the watchdog to silence (rules are SKIPPED, never guessed) —
    # nothing on the money path depends on any of this.
    alerts:
      # The scraper the watchdog reads through. Inside compose it is the container name; a bare `mvn
      # spring-boot:run` on the host reaches the published port instead.
      prometheus-url: ${PROMETHEUS_URL:http://localhost:9091}
      # How often a round runs. 30s is far finer than the tightest window it protects (the 120s silence
      # rule), so a breach is announced within one window rather than one round late, and six PromQL
      # instant queries every 30s is nothing. Milliseconds, like every other @Scheduled delay in this
      # platform: Spring's fixedDelayString accepts a plain number or ISO-8601, never "30s".
      fixed-delay-ms: ${ALERTS_FIXED_DELAY_MS:30000}
      # How long SETTLED may stand still WHILE DEBITS ARE FLOWING before that is an incident. A normal
      # settlement is <=10s (ADR-0003), so this is a dozen budgets of slack: a merely slow rail must not
      # page anyone, but the window still closes well inside the 5-minute reconciliation SLO.
      settlement-silence: ${ALERTS_SETTLEMENT_SILENCE:120s}
      # Zero, deliberately: the FIRST message in the DLQ is the alert. A dead-lettered settlement is money
      # parked in the clearing account that no automatic path is releasing (ADR-0003), so there is no
      # "acceptable backlog" to tolerate before a human looks.
      dlq-depth-bound: ${ALERTS_DLQ_DEPTH_BOUND:0}
      # The same <5-min SLO number as slo-breach-seconds above. Two vantage points on one threshold: the
      # in-process alert (step 35) sees it the moment a scan computes it even with Prometheus down, and
      # this rule sees it across restarts and from the platform's point of view.
      reconciliation-age: ${ALERTS_RECONCILIATION_AGE:300s}
      # How far the outbox publisher may fall behind. Past this, PixDebited events are committed but
      # unpublished (ADR-0004) — settlement is not failing, it is not being ASKED, which looks identical
      # on every technical panel and is exactly what a silence-shaped rule is for.
      outbox-lag: ${ALERTS_OUTBOX_LAG:60s}
      # The fail-open CEILING (ADR-0005). Skipping the fraud check under timeout is a deliberate design,
      # so the alert is not "it happened" but "it is now routine": above 5% of decisions, sends are
      # regularly unscored and the 200ms budget needs attention rather than tolerance.
      fraud-skipped-ceiling: ${ALERTS_FRAUD_SKIPPED_CEILING:0.05}
      # The balance cache hit-rate FLOOR (ADR-0008). The 300ms p99 budget (KR2.2) assumes most reads are
      # served from Redis; below 70% the budget is resting on the ledger, which still answers correctly
      # but not necessarily in time. Correctness is never at stake here — no money decision reads the
      # cache — so this is a latency-risk signal, not a money one.
      cache-hit-floor: ${ALERTS_CACHE_HIT_FLOOR:0.70}
      # The PromQL lookback the two ratio rules are measured over. Recent behaviour, not a lifetime
      # average: a cumulative hit rate over a week would take days to react to a cache that just died.
      ratio-window: ${ALERTS_RATIO_WINDOW:10m}
      # How many events a ratio needs in that window before it is allowed to mean anything. Under this,
      # the rule reports SKIPPED rather than dividing by an almost-empty denominator — otherwise the
      # cache-hit floor fires every quiet night purely because nobody read a balance (see AlertRule.Ratio).
      ratio-minimum-samples: ${ALERTS_RATIO_MINIMUM_SAMPLES:20}
  # The immutable audit trail (step 43). settlement-service is the platform's audit writer: it consumes
  # the ONLY unfiltered subscription on pix-events (audit-queue, step 42) and appends every event as a
  # JSON line to S3. Audit does not act on events, it records that they happened — which is why the
  # subscription has no filter and why this consumer parses only enough of the envelope (eventId) to
  # dedupe and log; the line stored is the event verbatim.
  audit:
    # The immutable bucket: versioning + Object Lock COMPLIANCE with a 1825-day (5-year, the BACEN
    # retention) DEFAULT retention, applied by S3 to every object. The writer never asks for retention,
    # so it can never forget to (infra/localstack/init/09-audit.sh).
    bucket: ${AUDIT_BUCKET:pix-audit-log}
    # The <service> segment of the object key yyyy/MM/dd/HH/<service>-<uuid>.jsonl — who wrote the
    # object. Configuration, not a constant: a second writer (a replica, or another service) drops its
    # own name into the same partition without ever colliding.
    writer-name: ${AUDIT_WRITER_NAME:settlement-service}
    # The unfiltered queue this writer consumes, resolved to its URL at startup: an audit writer that
    # boots healthy while consuming nothing would leave a compliance obligation silently unmet.
    queue-name: ${AUDIT_QUEUE_NAME:audit-queue}
    batch:
      # The cost/latency dial. ~100 events per object keeps S3 requests (and tiny-object overhead) down
      # by two orders of magnitude versus one PutObject per event; the price is that an event may sit in
      # memory — durably held by SQS the whole time — until the batch is due.
      max-events: ${AUDIT_BATCH_MAX_EVENTS:100}
      # The ceiling on that wait, measured from the OLDEST buffered event, so a trickle of traffic can
      # never leave a line unwritten indefinitely. 30s is the promise the consumer's long poll is capped
      # by (see wait-time-seconds below).
      max-age-seconds: ${AUDIT_BATCH_MAX_AGE_SECONDS:30}
    consumer:
      # Messages per receive (SQS maximum is 10) — they are only buffered here, never worked on, so the
      # tick is cheap regardless.
      batch-size: ${AUDIT_BATCH_SIZE:10}
      # How long a receive may block. Capped at runtime by the time left before the batch's flush
      # deadline: a static 20s poll against a 30s promise would let a batch age up to 50s.
      wait-time-seconds: ${AUDIT_WAIT_TIME_SECONDS:20}
      # How long this process owns a buffered message. MUST exceed max-age-seconds plus the write: the
      # batch holds messages past the queue's own 30s visibility timeout, so whoever holds a message
      # extends its lease or SQS hands it to the next receiver and the line is written twice for
      # nothing. If this process dies mid-batch the lease simply expires and everything is redelivered.
      lease-seconds: ${AUDIT_LEASE_SECONDS:120}
      # Gap between polls; the long poll already does the waiting.
      fixed-delay-ms: ${AUDIT_CONSUMER_DELAY_MS:500}

  # Master switch for every background job in this service (the settlement consumer, the reconciliation
  # scanner and the audit writer). True in every
  # real run; integration tests set it false and drive one tick explicitly, because Spring caches
  # contexts across test classes and a live consumer would drain the shared queue mid-assertion.
  schedulers:
    enabled: ${PIX_SCHEDULERS_ENABLED:true}

# The BACEN SPI (mock-bacen-spi, step 30). Defaults target a locally-run stub on 9090
# (docs/local-dev.md §2); compose overrides it to the service name on the shared network.
services:
  # account-service's DICT seam, called by the inbound flow (step 37) to turn the destination Pix key
  # into the account to credit. Short timeouts because the RAIL is waiting on this call (BACEN holds the
  # webhook open): a hung directory must surface as a 503 the rail re-presents, never a pinned thread.
  # Same budget account-service itself allows for the DICT hop on the send path.
  account-service:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout-ms: ${ACCOUNT_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${ACCOUNT_READ_TIMEOUT_MS:1500}
  # ledger-service, called on a DEFINITIVE settlement outcome (step 33): CLEARING_RELEASE on success,
  # the compensating reversal on a permanent refusal — and, since step 37, the PIX_IN credit of an
  # inbound Pix. Short timeouts — a hung ledger surfaces as a timeout (nothing posted) and the message
  # redelivers (or the rail re-presents), which the idempotent -rel/-rev/in- txId makes safe.
  ledger-service:
    base-url: ${LEDGER_BASE_URL:http://localhost:8085}
    connect-timeout-ms: ${LEDGER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LEDGER_READ_TIMEOUT_MS:3000}
  bacen:
    base-url: ${BACEN_BASE_URL:http://localhost:9090}
    # 12s read timeout (ADR-0003): BACEN settles in up to 10s, so a tighter budget would abandon healthy
    # settlements, while a looser one would hold an SQS message past its 30s visibility timeout and let a
    # redelivery race the worker still handling it. Nobody is waiting on this call — the payer got their
    # 202 seconds ago — which is why patience here is the opposite posture to the 200ms fraud budget.
    connect-timeout-ms: ${BACEN_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BACEN_READ_TIMEOUT_MS:12000}

# AWS SDK → LocalStack (DynamoDB + SQS). Defaults target a locally-run LocalStack; compose overrides
# AWS_ENDPOINT_URL to http://localstack:4566. Credentials are dummies LocalStack ignores but the SDK
# demands. ITs override these via LocalStackTestBase's @DynamicPropertySource (same aws.* keys).
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  # Standalone amazon/dynamodb-local container, separate from LocalStack's SQS endpoint above — see
  # AwsProperties#dynamoDbEndpointUrl (docs/load/BOTTLENECK.md). Falls back to endpoint-url so
  # LocalStackTestBase's ITs (which only override aws.endpoint-url) are unaffected.
  dynamodb-endpoint-url: ${DYNAMODB_ENDPOINT_URL:${aws.endpoint-url}}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

# Actuator: expose only what compose healthchecks and the runbook rely on.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` is the scrape surface (step 44): Prometheus polls it every 10s and Grafana reads
        # everything from there. Exposed on the same unauthenticated actuator path as health — a local
        # sandbox decision; in production the metrics port is bound to an internal interface and never
        # routed publicly (the metric values themselves are business data).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Enables the liveness/readiness health groups the compose healthcheck probes.
      probes:
        enabled: true
