server:
  port: 8084

spring:
  application:
    name: payment-service

  # Redis connection (Lettuce, via spring-boot-starter-data-redis). Redis is its own container — the
  # local stand-in for ElastiCache, which LocalStack does not emulate (ADR-0008). Defaults target a
  # locally-run Redis; compose overrides REDIS_HOST to the `redis` service name on the shared network.
  # This service READS and WRITES `balance:<accountId>` (cache-aside, step 40); ledger-service deletes
  # those keys after each posting. A Redis outage degrades this service to ledger-speed reads, never to
  # errors — RedisBalanceCache turns every Redis failure into a cache miss.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # HARD TIME BOUND on every Redis command, and the reason it exists: a cache that HANGS is worse
      # than a cache that fails. Lettuce defaults to a 60s command timeout, so a Redis that is *stopped*
      # (packets dropped rather than refused) turned a balance read into a ~114s request in the step-40
      # drill — availability lost, not degraded, which is the exact opposite of what ADR-0008 promises.
      # 200ms is generous for a LAN Redis (~1ms) and small against the 300ms p99 budget; with Redis
      # unreachable a read pays this twice (the failed GET and the failed SET) and still answers from
      # the ledger. Fail fast, then fall through.
      timeout: ${REDIS_TIMEOUT:200ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}

# Local-dev CORS so the open-from-disk API explorer (tools/api-explorer/index.html, Origin: null) can
# call this service from the browser. Permissive + credential-free by design (the token is a Bearer
# header, never a cookie); a deployed posture pins these origins (step-45 hardening). The CorsFilter
# is ordered ahead of the JWT auth filter so pre-flights aren't 401'd. See infra/CorsConfig.
web:
  cors:
    allowed-origin-patterns: "*"

# HS256 validation config (ADR-0007). The secret must match auth-service's JWT_SECRET — this service
# only VALIDATES tokens, it never mints them. public-paths is the allow-list the shared JwtAuthFilter
# skips: payment-service has no /login, so only the actuator surface is public. Every /v1/payments
# call requires a valid token — the debtor account is read from its accountId claim (Domain Safety
# Rule #1), never from the request body.
jwt:
  secret: ${JWT_SECRET:dev-only-hs256-secret-change-me-please-32b}
  public-paths:
    - /actuator/**
  # Workload identity (step 68, ADR-0017). payment-service exposes no /internal/** route of its own,
  # so this name is used purely as the `iss` of the tokens it mints for ledger-, account- and
  # fraud-service. Until this step it minted nothing and forwarded the caller's bearer instead —
  # which made any user's login a valid credential on POST /internal/ledger/postings.
  service-name: payment-service
  # A minute is generous for a call whose own timeout budget is measured in milliseconds; it exists
  # to absorb clock skew between containers, not to let a token outlive its call.
  service-token-ttl: 60s

# Pix participant identifier (ISPB — 8 digits) baked into every endToEndId this service mints
# (E<ISPB><yyyyMMddHHmm-UTC><random>). One place to change PlatinumCoin's participant code; the
# value below is the one docs/api/openapi.yaml uses in its endToEndId example.
pix:
  ispb: ${PIX_ISPB:12345678}
  # Where an EXTERNAL send parks the money it debits (step 27): the ledger's system clearing account,
  # money in flight to BACEN, exempt from the non-negative rule (ledger AccountPolicy). It is config,
  # not a constant, because step 52 shards it into SPI_CLEARING#00..#15 to spread a hot partition —
  # a change of which id is passed, never of the orchestration or of the ledger contract.
  clearing-account-id: ${PIX_CLEARING_ACCOUNT_ID:SPI_CLEARING}
  # How many sub-accounts that clearing position is spread over (step 52). One DynamoDB partition caps
  # at 1,000 WCU/s and a transactional write costs 2x, so a single clearing item ceilings near 500
  # transactional updates/s — and every external send credits it. 16 shards move that ceiling an order
  # of magnitude out; `1` returns the bare id and is the un-sharded baseline the findings doc measures
  # against. THE COUNT IS A CAPACITY KNOB, NOT A CORRECTNESS ONE: the shard a debit used is persisted on
  # the transaction and a reversal reads it back, so changing this never strands an in-flight payment.
  # It must match the shard count the ledger seeds and sums (CLEARING_SHARDS in docker-compose).
  clearing-shards: ${CLEARING_SHARDS:16}
  # Balance cache-aside (step 40, ADR-0008). The TTL is deliberately SHORT and does two jobs: on the
  # happy path it caps how long a balance may be displayed after an unrelated write elsewhere, and when
  # ledger-service's post-commit eviction is lost (it is best-effort — a Redis blip, a crash between the
  # commit and the DEL) it is the backstop that bounds the staleness to this window. Five seconds is
  # what makes "a missed invalidation is a display problem, never a money problem" a bounded claim;
  # raising it trades hit rate for how long a customer can see a number that already moved.
  balance-cache:
    ttl: ${BALANCE_CACHE_TTL:5s}
  # Resolving an AMBIGUOUS ledger outcome (step 66, ADR-0015). A timeout does not mean "nothing was
  # debited" — it means the answer never arrived — so the send re-POSTs the SAME txId, which the ledger
  # either commits or reports as a replay. `attempts` is the TOTAL number of POSTs one operation may
  # make (2 = the original call plus one resolving re-POST), because what is being bounded is how long
  # a user's request may sit on a misbehaving dependency: every attempt costs a full round trip against
  # the read timeout above. Still unknown afterwards ⇒ 503, no daily-limit release, and the claim keeps
  # its txId so the next attempt resolves it.
  ledger:
    attempts: ${LEDGER_RESOLUTION_ATTEMPTS:2}
    backoff: ${LEDGER_RESOLUTION_BACKOFF:200ms}
  events:
    # The ONE topic every domain event is published to (step 26); consumers fan out by subscribing with
    # a filter policy on the eventType message attribute. The ARN is injected rather than looked up by
    # name: a deployed service is granted sns:Publish on exactly this ARN (ADR-0013) and has no business
    # listing or creating topics. The default is the ARN LocalStack mints for 06-messaging-core.sh's
    # topic (account 000000000000); ITs override it with the disposable container's real ARN.
    topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:${AWS_REGION:us-east-1}:000000000000:pix-events}
  outbox:
    # The polling publisher of ADR-0004 (step 29), SPLIT INTO THREE LANES in step 71 (ADR-0019). Each
    # lane drains its own partition of the sparse gsi3 index — gsi3pk = OUTBOX#UNPUBLISHED#<LANE> — so a
    # backlog on one lane is not merely deprioritised by another lane's poll, it is never read by it.
    # Every lane publishes BEFORE marking published, so a crash in between costs a duplicate (consumers
    # dedupe by eventId) rather than a lost event (money stuck in clearing that nobody settles).
    #
    # Why this exists: docs/load/RESULTS.md Context 2. A single FIFO at batch 25 / 1s ≈ 25 events/s put
    # one external PixDebited behind 55,538 internal PixSettled events THAT HAD NO SUBSCRIBER, and the
    # payment crossed the 120s stuck threshold and was REVERSED by reconciliation instead of settling.
    # Raising the batch clears that number and preserves the failure mode; lanes remove it.
    lanes:
      # A MONEY FLOW IS BLOCKED. Until a PixDebited is published the payer's money sits in the clearing
      # account with nothing on its way to release it. Sized to stay ahead of the send rate and to keep
      # the lag an order of magnitude under the 120s stuck threshold that reversed the payment:
      # 200ms tick × batch 100 with 8 concurrent publishes is ~500 events/s of headroom against a
      # platform target of 58 TPS, so this lane empties every tick under any load step 47 profiles.
      settlement:
        fixed-delay-ms: ${OUTBOX_SETTLEMENT_DELAY_MS:200}
        batch-size: ${OUTBOX_SETTLEMENT_BATCH_SIZE:100}
        max-in-flight: ${OUTBOX_SETTLEMENT_MAX_IN_FLIGHT:8}
      # A PERSON IS WAITING TO SEE IT — the SSE stream and the statement. Late is a bad experience, not
      # a wrong balance, so this lane is sized generously but not urgently. It is also the lane the
      # internal-send flood lands on, which is exactly why it must not share a drain with settlement.
      notification:
        fixed-delay-ms: ${OUTBOX_NOTIFICATION_DELAY_MS:1000}
        batch-size: ${OUTBOX_NOTIFICATION_BATCH_SIZE:100}
        max-in-flight: ${OUTBOX_NOTIFICATION_MAX_IN_FLIGHT:4}
      # ONLY THE TRAIL READS IT. Minutes here cost nothing anyone can observe, so max-in-flight is 1 —
      # which means no thread pool at all, just the step-29 sequential publisher, on its own schedule.
      audit:
        fixed-delay-ms: ${OUTBOX_AUDIT_DELAY_MS:5000}
        batch-size: ${OUTBOX_AUDIT_BATCH_SIZE:50}
        max-in-flight: ${OUTBOX_AUDIT_MAX_IN_FLIGHT:1}
  # Cold statement export (step 53, ARCHITECTURE §6.14) — the async request/polling flow.
  export:
    # INPUT: ledger-service's cold archive (step 43). Read-only; payment-service never writes here. The
    # layout (account=<id>/yyyy-MM.jsonl) is a published artifact contract, not a shared table, so
    # ADR-0006 is untouched.
    archive-bucket: ${STATEMENT_ARCHIVE_BUCKET:pix-statement-archive}
    # OUTPUT: this service's own bucket for the assembled CSV artifacts.
    bucket: ${STATEMENT_EXPORT_BUCKET:pix-statement-exports}
    # How long a presigned download link lives. Signed per read, never stored — so this is "how long one
    # answer's link stays usable", not "how long the export lasts". Short because the URL IS the
    # credential while it lives; a client that finds it stale simply polls again.
    download-link-ttl-minutes: ${EXPORT_LINK_TTL_MINUTES:60}
    # How many deliveries the worker may spend on one export before turning it into a visible FAILED.
    # MUST STAY BELOW the queue's maxReceiveCount (5, infra/localstack/init/10-statement-exports.sh):
    # the platform should give the customer an answer before SQS gives the message to the DLQ, so the
    # DLQ is left holding only what the worker cannot even parse.
    max-attempts: ${EXPORT_MAX_ATTEMPTS:3}
    queue-name: ${STATEMENT_EXPORT_QUEUE:statement-export-queue}
    consumer:
      # Long polling: the receive blocks up to 20s waiting for work, so an idle system costs one request
      # every 20s instead of a stream of empty ones. fixedDelay, so a slow assembly never has the next
      # tick queued behind it.
      fixed-delay-ms: ${EXPORT_CONSUMER_DELAY_MS:1000}
      batch-size: ${EXPORT_CONSUMER_BATCH_SIZE:5}
      wait-time-seconds: ${EXPORT_CONSUMER_WAIT_SECONDS:20}
    dlq:
      queue-name: ${STATEMENT_EXPORT_DLQ:statement-export-queue-dlq}
      # A depth probe, not a scrape-time SQS call: the gauge reads an AtomicLong this tick refreshes.
      metric-refresh-ms: ${EXPORT_DLQ_METRIC_REFRESH_MS:15000}
  # Master switch for every background job in this service (the three outbox lane publishers, the
  # statement-export consumer and its DLQ probe). True in every real run; integration tests set it false
  # and drive each tick explicitly, because Spring caches contexts across test classes and a live poller
  # would drain the shared tables and queues mid-assertion.
  schedulers:
    enabled: ${PIX_SCHEDULERS_ENABLED:true}

# Service-to-service base URLs. payment-service reads the debtor's dailyLimitCents from account-service
# before reserving daily-limit headroom (step 20), resolves the destination Pix key against
# account-service's DICT seam, scores the send against fraud-service under a 200ms budget (step 25), and
# commands the atomic debit/credit against ledger-service (step 21).
# Defaults target locally-run services (ports 8082/8083/8085, docs/local-dev.md §2); compose overrides them
# to the service names on the shared network. Both internal endpoints are behind the JWT filter, so the
# caller's bearer token is forwarded (ADR-0007; a service credential is the deployed posture, step-45).
services:
  account-service:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
  ledger-service:
    base-url: ${LEDGER_SERVICE_BASE_URL:http://localhost:8085}
    # A hung ledger must surface as a timeout (→ 503 LEDGER_UNAVAILABLE + Retry-After), not pin the
    # request thread. A deployed build adds a circuit breaker after repeated failures (step 32).
    connect-timeout-ms: ${LEDGER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LEDGER_READ_TIMEOUT_MS:3000}
  fraud-service:
    base-url: ${FRAUD_SERVICE_BASE_URL:http://localhost:8083}
    # The 200ms hard budget of ADR-0005, split connect 50ms + read 150ms. A slow or down fraud-service
    # must surface as a timeout the client turns into a fail-open SKIPPED (send proceeds, flagged), never
    # pin the request thread. fraud-service targets p99 < 150ms, leaving margin under this budget.
    connect-timeout-ms: ${FRAUD_CONNECT_TIMEOUT_MS:50}
    read-timeout-ms: ${FRAUD_READ_TIMEOUT_MS:150}

# AWS SDK → LocalStack (DynamoDB). Defaults target a locally-run LocalStack; compose overrides
# AWS_ENDPOINT_URL to http://localstack:4566. Credentials are dummies LocalStack ignores but the SDK
# demands. ITs override these via LocalStackTestBase's @DynamicPropertySource (same aws.* keys).
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  # Standalone amazon/dynamodb-local container, separate from LocalStack's SNS endpoint above — see
  # AwsProperties#dynamoDbEndpointUrl (docs/load/BOTTLENECK.md). Falls back to endpoint-url so
  # LocalStackTestBase's ITs (which only override aws.endpoint-url) are unaffected.
  dynamodb-endpoint-url: ${DYNAMODB_ENDPOINT_URL:${aws.endpoint-url}}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

# Actuator: expose only what compose healthchecks and the runbook rely on.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` is the scrape surface (step 44): Prometheus polls it every 10s and Grafana reads
        # everything from there. Exposed on the same unauthenticated actuator path as health — a local
        # sandbox decision; in production the metrics port is bound to an internal interface and never
        # routed publicly (the metric values themselves are business data).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Enables the liveness/readiness health groups the compose healthcheck probes.
      probes:
        enabled: true
