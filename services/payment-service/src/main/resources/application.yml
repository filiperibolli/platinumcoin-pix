server:
  port: 8084

spring:
  application:
    name: payment-service

# Local-dev CORS so the open-from-disk API explorer (tools/api-explorer/index.html, Origin: null) can
# call this service from the browser. Permissive + credential-free by design (the token is a Bearer
# header, never a cookie); a deployed posture pins these origins (step-45 hardening). The CorsFilter
# is ordered ahead of the JWT auth filter so pre-flights aren't 401'd. See infra/CorsConfig.
web:
  cors:
    allowed-origin-patterns: "*"

# HS256 validation config (ADR-0007). The secret must match auth-service's JWT_SECRET — this service
# only VALIDATES tokens, it never mints them. public-paths is the allow-list the shared JwtAuthFilter
# skips: payment-service has no /login, so only the actuator surface is public. Every /v1/payments
# call requires a valid token — the debtor account is read from its accountId claim (Domain Safety
# Rule #1), never from the request body.
jwt:
  secret: ${JWT_SECRET:dev-only-hs256-secret-change-me-please-32b}
  public-paths:
    - /actuator/**

# Pix participant identifier (ISPB — 8 digits) baked into every endToEndId this service mints
# (E<ISPB><yyyyMMddHHmm-UTC><random>). One place to change PlatinumCoin's participant code; the
# value below is the one docs/api/openapi.yaml uses in its endToEndId example.
pix:
  ispb: ${PIX_ISPB:12345678}
  # Where an EXTERNAL send parks the money it debits (step 27): the ledger's system clearing account,
  # money in flight to BACEN, exempt from the non-negative rule (ledger AccountPolicy). It is config,
  # not a constant, because step 52 shards it into SPI_CLEARING#00..#15 to spread a hot partition —
  # a change of which id is passed, never of the orchestration or of the ledger contract.
  clearing-account-id: ${PIX_CLEARING_ACCOUNT_ID:SPI_CLEARING}

# Service-to-service base URLs. payment-service reads the debtor's dailyLimitCents from account-service
# before reserving daily-limit headroom (step 20), resolves the destination Pix key against
# account-service's DICT seam, scores the send against fraud-service under a 200ms budget (step 25), and
# commands the atomic debit/credit against ledger-service (step 21).
# Defaults target locally-run services (ports 8082/8083/8085, docs/local-dev.md §2); compose overrides them
# to the service names on the shared network. Both internal endpoints are behind the JWT filter, so the
# caller's bearer token is forwarded (ADR-0007; a service credential is the deployed posture, step-45).
services:
  account-service:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
  ledger-service:
    base-url: ${LEDGER_SERVICE_BASE_URL:http://localhost:8085}
    # A hung ledger must surface as a timeout (→ 503 LEDGER_UNAVAILABLE + Retry-After), not pin the
    # request thread. A deployed build adds a circuit breaker after repeated failures (step 32).
    connect-timeout-ms: ${LEDGER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LEDGER_READ_TIMEOUT_MS:3000}
  fraud-service:
    base-url: ${FRAUD_SERVICE_BASE_URL:http://localhost:8083}
    # The 200ms hard budget of ADR-0005, split connect 50ms + read 150ms. A slow or down fraud-service
    # must surface as a timeout the client turns into a fail-open SKIPPED (send proceeds, flagged), never
    # pin the request thread. fraud-service targets p99 < 150ms, leaving margin under this budget.
    connect-timeout-ms: ${FRAUD_CONNECT_TIMEOUT_MS:50}
    read-timeout-ms: ${FRAUD_READ_TIMEOUT_MS:150}

# AWS SDK → LocalStack (DynamoDB). Defaults target a locally-run LocalStack; compose overrides
# AWS_ENDPOINT_URL to http://localstack:4566. Credentials are dummies LocalStack ignores but the SDK
# demands. ITs override these via LocalStackTestBase's @DynamicPropertySource (same aws.* keys).
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

# Actuator: expose only what compose healthchecks and the runbook rely on.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Enables the liveness/readiness health groups the compose healthcheck probes.
      probes:
        enabled: true
