server:
  port: 8082

spring:
  application:
    name: account-service

# Local-dev CORS so the open-from-disk API explorer (tools/api-explorer/index.html, Origin: null) can
# call this service from the browser. Permissive + credential-free by design (the token is a Bearer
# header, never a cookie); a deployed posture pins these origins (step-45 hardening). The CorsFilter
# is ordered ahead of the JWT auth filter so pre-flights aren't 401'd. See infra/CorsConfig.
web:
  cors:
    allowed-origin-patterns: "*"

# HS256 validation config (ADR-0007). The secret must match auth-service's JWT_SECRET — this service
# only VALIDATES tokens, it never mints them. public-paths is the allow-list the shared JwtAuthFilter
# skips: account-service has no /login, so only the actuator surface is public. NOTE: /internal/** is
# intentionally NOT public — the internal lookup requires a valid token (see InternalAccountController).
jwt:
  secret: ${JWT_SECRET:dev-only-hs256-secret-change-me-please-32b}
  public-paths:
    - /actuator/**
  # Workload identity + the per-route scope map (step 68, ADR-0017). See ledger-service's copy for
  # the reasoning; the shape is identical everywhere on purpose.
  service-name: account-service
  internal-routes:
    - method: GET
      pattern: /internal/pix-keys/resolve
      scope: keys:resolve
    - method: GET
      pattern: /internal/accounts/**
      scope: accounts:read

# AWS SDK → LocalStack (DynamoDB). Defaults target a locally-run LocalStack; compose overrides
# AWS_ENDPOINT_URL to http://localstack:4566. Credentials are dummies LocalStack ignores but the SDK
# demands. ITs override these via LocalStackTestBase's @DynamicPropertySource (same aws.* keys).
aws:
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  # Standalone amazon/dynamodb-local container, separate from LocalStack's SNS/SQS endpoint above —
  # see AwsProperties#dynamoDbEndpointUrl (docs/load/BOTTLENECK.md). Falls back to endpoint-url so
  # LocalStackTestBase's ITs (which only override aws.endpoint-url) are unaffected.
  dynamodb-endpoint-url: ${DYNAMODB_ENDPOINT_URL:${aws.endpoint-url}}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

# Outbound dependencies. mock-bacen-spi plays BACEN's DICT: any Pix key NOT registered locally is
# delegated to GET /spi/dict/{key} (step 30, closing the step-11 seam), and an answer turns the send into
# its external branch. This lookup is on the SYNCHRONOUS send path with the payer waiting on it, so the
# timeouts are tight — a container that is gone must surface as a timeout in well under a second, never as
# a pinned request thread. A timeout (or any non-404 failure) becomes 503 DIRECTORY_UNAVAILABLE, never a
# misleading 404: "I could not ask" and "it does not exist" are different facts (see HttpExternalDirectory).
services:
  bacen:
    base-url: ${BACEN_BASE_URL:http://localhost:9090}
    connect-timeout-ms: ${BACEN_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${BACEN_READ_TIMEOUT_MS:1500}

# Actuator: expose only what compose healthchecks and the runbook rely on.
management:
  endpoints:
    web:
      exposure:
        # `prometheus` is the scrape surface (step 44): Prometheus polls it every 10s and Grafana reads
        # everything from there. Exposed on the same unauthenticated actuator path as health — a local
        # sandbox decision; in production the metrics port is bound to an internal interface and never
        # routed publicly (the metric values themselves are business data).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Enables the liveness/readiness health groups the compose healthcheck probes.
      probes:
        enabled: true
