# PlatinumCoin Pix — the platform's own services (eight Spring Boot processes).
#
# Included by infra/docker-compose.yml; not meant to be run on its own, because every block here
# `depends_on` something in backing.yml. To run the money path WITHOUT the observability stack:
#   docker compose -f infra/compose/backing.yml -f infra/compose/platform.yml up -d
#
# ── "Service in compose" pattern — LATER SERVICES COPY THIS BLOCK ─────────────
#   build.context: ../..         → repo root, so the Dockerfile sees target jars & common-lib
#   build.dockerfile: <path>     → the service's own Dockerfile
#   networks: [pix-net]          → shared bridge; services reach each other by name
#   healthcheck → /actuator/health → the contract compose (and the runbook) depend on;
#     `depends_on: condition: service_healthy` in later services gates startup on it.
#   Prereq: `mvn clean package` must have built the jars before `docker compose build`.
# ──────────────────────────────────────────────────────────────────────────────

services:

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    image: platinumcoin/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # HS256 shared secret (>= 32 bytes). Dev-only value; a real deployment injects a managed
      # secret. Every service that later VALIDATES tokens must share this exact value.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
    networks:
      - pix-net
    healthcheck:
      # amazoncorretto:21 ships /usr/bin/curl; hit the readiness group so the container
      # is only "healthy" once the app can actually serve, not merely once the JVM is up.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # account-service — first service to read DynamoDB (Sprint 2). Copies the auth-service
  # "service in compose" block, and additionally gates startup on LocalStack being healthy
  # (depends_on: service_healthy) since it reads pix_accounts. AWS_ENDPOINT_URL points at the
  # localstack container by name on pix-net.

  # account-service — first service to read DynamoDB (Sprint 2). Copies the auth-service
  # "service in compose" block, and additionally gates startup on LocalStack being healthy
  # (depends_on: service_healthy) since it reads pix_accounts. AWS_ENDPOINT_URL points at the
  # localstack container by name on pix-net.
  account-service:
    build:
      context: ../..
      dockerfile: services/account-service/Dockerfile
    image: platinumcoin/account-service
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Must match auth-service's JWT_SECRET — account-service only validates tokens.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach LocalStack (SNS/SQS — account-service uses neither today, kept for parity with the other
      # services' AwsProperties shape) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      # Read ONLY under the `local` profile below — the placeholder pair LocalStack needs to derive its
      # account id, never authentication (ADR-0013).
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # ADR-0013 (step 45): an AWS client is pointed at the emulator by the `local` profile and by
      # NOTHING else — without it the SDK's DefaultCredentialsProvider chain looks for an ambient role,
      # finds none here, and the service fails loudly at startup instead of quietly reaching LocalStack
      # while looking configured for production. If you export SPRING_PROFILES_ACTIVE yourself, INCLUDE
      # local (e.g. `json-logs,local`) — see docs/local-dev.md §3.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # mock-bacen-spi plays BACEN's DICT: a Pix key NOT registered locally is delegated to
      # GET /spi/dict/{key} (step 30), which is what makes bob@otherbank.com resolve and the external
      # send branch reachable. No bearer token is forwarded on this hop — BACEN is outside our trust
      # domain. Unreachable/slow ⇒ 503 DIRECTORY_UNAVAILABLE, never a misleading 404.
      BACEN_BASE_URL: http://mock-bacen-spi:9090
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # Local-dev convenience only, NOT a correctness requirement: internal keys resolve with the SPI
      # down, and an external lookup fails closed per request (503 + Retry-After) rather than poisoning
      # the service. Gating startup here just means the first external send in a demo works immediately.
      mock-bacen-spi:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ledger-service — the heart (Sprint 3). The ONLY writer of pix_ledger (ADR-0006); step 13
  # ships the read half, a strongly-consistent balance read. Same block as account-service:
  # it also reads DynamoDB, so it gates startup on LocalStack being healthy — and, since the
  # seed of the money supply runs in LocalStack's ready.d, `service_healthy` is what guarantees
  # the balances exist before the first read.

  # ledger-service — the heart (Sprint 3). The ONLY writer of pix_ledger (ADR-0006); step 13
  # ships the read half, a strongly-consistent balance read. Same block as account-service:
  # it also reads DynamoDB, so it gates startup on LocalStack being healthy — and, since the
  # seed of the money supply runs in LocalStack's ready.d, `service_healthy` is what guarantees
  # the balances exist before the first read.
  ledger-service:
    build:
      context: ../..
      dockerfile: services/ledger-service/Dockerfile
    image: platinumcoin/ledger-service
    container_name: ledger-service
    ports:
      - "8085:8085"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Clearing write shards (step 52): see the CLEARING_SHARDS comment in the settlement-service
      # block. Every service that assigns, sums or seeds a clearing account reads this same value.
      CLEARING_SHARDS: ${CLEARING_SHARDS:-16}
      # Must match auth-service's JWT_SECRET — ledger-service only validates tokens. Every one of
      # its endpoints is authenticated (/internal/** is not on jwt.public-paths).
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach LocalStack by service name on the shared network. Since step 43 this is a REAL dependency
      # of this service and not parity boilerplate: the statement cold-archive job writes S3
      # pix-statement-archive through this endpoint (SNS/SQS remain unused here).
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      # Read ONLY under the `local` profile below — the placeholder pair LocalStack needs to derive its
      # account id, never authentication (ADR-0013).
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # ADR-0013 (step 45): an AWS client is pointed at the emulator by the `local` profile and by
      # NOTHING else — without it the SDK's DefaultCredentialsProvider chain looks for an ambient role,
      # finds none here, and the service fails loudly at startup instead of quietly reaching LocalStack
      # while looking configured for production. If you export SPRING_PROFILES_ACTIVE yourself, INCLUDE
      # local (e.g. `json-logs,local`) — see docs/local-dev.md §3.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # Redis, for ONE operation (step 40): deleting the `balance:<accountId>` keys a committed posting
      # just made stale (ADR-0008 invalidation-on-write). The ledger never READS a balance from Redis —
      # the money decision is the conditional write in DynamoDB. Losing Redis costs display freshness
      # (bounded by the 5s TTL), never correctness, which is why this is not a hard dependency below.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The statement cold archive (step 43). ledger-service owns pix_ledger, so it is the service that
      # archives it. The window is where the ONLINE statement ends and the cold archive begins; nothing
      # is ever deleted from the ledger locally (ArchiveOldEntriesUseCase documents the prod difference).
      #
      # 0 rather than the 90-day default ON PURPOSE for the sandbox: a freshly seeded stack has no entry
      # older than 90 days, so the demo job would archive nothing and look broken. With 0 the cutoff is
      # "now" and every posting is archived on the next run — which is what makes
      #   aws --endpoint-url=http://localhost:4566 s3 ls s3://pix-statement-archive/ --recursive
      # show something a minute after a Pix (docs/local-dev.md §7).
      STATEMENT_ARCHIVE_HOT_WINDOW_DAYS: "0"
      # Every minute in the sandbox instead of the hourly production default, for the same reason: a demo
      # should not have to wait an hour to see the job work.
      STATEMENT_ARCHIVE_DELAY_MS: "60000"
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # A SOFT dependency: postings commit and succeed with Redis down (the eviction fails open with a
      # WARN). Gating startup on it is local-dev tidiness — so the very first posting can invalidate —
      # not a correctness requirement.
      redis:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # payment-service — the send-Pix entry point (Sprint 4). The one endpoint an end user reaches to
  # move money. Step 18 ships the walking skeleton of POST /v1/payments/pix (persist RECEIVED, 202).
  # Same block as account-service: it reads/writes DynamoDB (pix_transactions), so it gates startup on
  # LocalStack being healthy — service_healthy guarantees step 17's payment tables exist first.

  # payment-service — the send-Pix entry point (Sprint 4). The one endpoint an end user reaches to
  # move money. Step 18 ships the walking skeleton of POST /v1/payments/pix (persist RECEIVED, 202).
  # Same block as account-service: it reads/writes DynamoDB (pix_transactions), so it gates startup on
  # LocalStack being healthy — service_healthy guarantees step 17's payment tables exist first.
  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    image: platinumcoin/payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Must match auth-service's JWT_SECRET — payment-service only validates tokens. The debtor
      # account is read from the token's accountId claim (Domain Safety Rule #1), never the body.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # PlatinumCoin's Pix participant id, baked into every endToEndId (E<ISPB><ts><random>).
      PIX_ISPB: "12345678"
      # Clearing write shards (step 52): see the CLEARING_SHARDS comment in the settlement-service
      # block. Every service that assigns, sums or seeds a clearing account reads this same value.
      CLEARING_SHARDS: ${CLEARING_SHARDS:-16}
      # account-service base URL: payment-service reads the debtor's dailyLimitCents from its
      # internal endpoint before reserving daily-limit headroom (step 20), and resolves the
      # destination Pix key against its DICT seam (step 21). Service name on the shared network;
      # the caller's bearer token is forwarded (ADR-0007).
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8082
      # ledger-service base URL: payment-service commands the atomic debit/credit that settles an
      # internal Pix (step 21). Service name on the shared network; bearer token forwarded.
      LEDGER_SERVICE_BASE_URL: http://ledger-service:8085
      # fraud-service base URL: payment-service scores the send under a hard 200ms budget between the
      # limit check and the debit (step 25). A slow/down fraud-service fails open (SKIPPED), so this is
      # a soft dependency at runtime; the URL is here so the happy path scores. Bearer token forwarded.
      FRAUD_SERVICE_BASE_URL: http://fraud-service:8083
      # Reach LocalStack (SNS — the outbox publisher) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      # Read ONLY under the `local` profile below — the placeholder pair LocalStack needs to derive its
      # account id, never authentication (ADR-0013).
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # ADR-0013 (step 45): an AWS client is pointed at the emulator by the `local` profile and by
      # NOTHING else — without it the SDK's DefaultCredentialsProvider chain looks for an ambient role,
      # finds none here, and the service fails loudly at startup instead of quietly reaching LocalStack
      # while looking configured for production. If you export SPRING_PROFILES_ACTIVE yourself, INCLUDE
      # local (e.g. `json-logs,local`) — see docs/local-dev.md §3.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # The SNS topic the outbox publisher drains into (step 29). Injected rather than looked up by
      # name: a deployed service is granted sns:Publish on exactly this ARN and may not list topics
      # (ADR-0013). This is the ARN 06-messaging-core.sh's `create-topic` returns in LocalStack.
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:pix-events
      # Redis — the balance cache-aside read path (step 40, ADR-0008): GET/SET `balance:<accountId>`
      # with a 5s TTL, invalidated by ledger-service after every posting. A Redis outage degrades this
      # service to ledger-speed balance reads (every read is a miss), never to errors.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # SOFT, like fraud-service below: balance reads work with Redis down, they just fall through to
      # the ledger every time. Gated here so the happy path is cached from the first request.
      redis:
        condition: service_healthy
      # The daily-limit check + key resolution call account-service; gate startup on it being
      # healthy so the first send doesn't race a not-yet-ready dependency.
      account-service:
        condition: service_healthy
      # The internal send debits via ledger-service; gate startup on it being healthy too (step 21).
      ledger-service:
        condition: service_healthy
      # fraud-service is a SOFT dependency (fail-open, ADR-0005): payment sends fine at runtime even if
      # it is down. Gating startup on its health here is local-dev convenience only — so the happy path
      # scores immediately — not a correctness requirement. The fail-open is proven at runtime by
      # `docker compose stop fraud-service` after boot: the send still returns 202, flagged SKIPPED.
      fraud-service:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # fraud-service — synchronous fraud scoring in the send path (Sprint 5). Step 23 ships the skeleton:
  # JWT-validating, Redis-connected, health-reporting, no business endpoint yet (POST /score is step 24).
  # Copies the auth-service "service in compose" block; it reads Redis (velocity counters), not DynamoDB,
  # so it gates startup on `redis` being healthy rather than LocalStack.

  # fraud-service — synchronous fraud scoring in the send path (Sprint 5). Step 23 ships the skeleton:
  # JWT-validating, Redis-connected, health-reporting, no business endpoint yet (POST /score is step 24).
  # Copies the auth-service "service in compose" block; it reads Redis (velocity counters), not DynamoDB,
  # so it gates startup on `redis` being healthy rather than LocalStack.
  fraud-service:
    build:
      context: ../..
      dockerfile: services/fraud-service/Dockerfile
    image: platinumcoin/fraud-service
    container_name: fraud-service
    ports:
      - "8083:8083"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Must match auth-service's JWT_SECRET — fraud-service only validates tokens (step 25 forwards the
      # caller's bearer token to it).
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach Redis by service name on the shared network (velocity counters; ADR-0008 ElastiCache stand-in).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Empty (default profile) unless the HOST shell exports it — never baked in here as a fixed value.
      # docs/load/RESULTS.md's `loadtest` profile (application.yml) raises ONLY the two velocity
      # thresholds so a k6 storm concentrated on one account measures the ledger, not fraud-service's
      # (correct) velocity rule. To arm it for a load-test run:
      #   SPRING_PROFILES_ACTIVE=loadtest docker compose -f infra/docker-compose.yml up -d --no-deps fraud-service
      # and to put it back before anything else touches the stack:
      #   docker compose -f infra/docker-compose.yml up -d --no-deps fraud-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      # The scoring flow (step 24) reads/writes Redis; gate startup on it being healthy.
      redis:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # mock-bacen-spi — the controllable external dependency (Sprint 6, step 30). Two roles in one stub: the
  # SPI rail (POST /spi/settlements, idempotent by endToEndId, with runtime-armable latency / failure /
  # timeout injection) and the DICT (GET /spi/dict/{key}), which is what finally lets an external key
  # resolve. Copies the auth-service "service in compose" block; it depends on nothing at all — no AWS, no
  # Redis, no token — because it is deliberately outside PlatinumCoin (a real participant would reach it
  # over mTLS with an ICP-Brasil certificate). Settlements are held IN MEMORY: restarting this container
  # wipes BACEN's memory, which is a useful drill rather than a defect.

  # mock-bacen-spi — the controllable external dependency (Sprint 6, step 30). Two roles in one stub: the
  # SPI rail (POST /spi/settlements, idempotent by endToEndId, with runtime-armable latency / failure /
  # timeout injection) and the DICT (GET /spi/dict/{key}), which is what finally lets an external key
  # resolve. Copies the auth-service "service in compose" block; it depends on nothing at all — no AWS, no
  # Redis, no token — because it is deliberately outside PlatinumCoin (a real participant would reach it
  # over mTLS with an ICP-Brasil certificate). Settlements are held IN MEMORY: restarting this container
  # wipes BACEN's memory, which is a useful drill rather than a defect.
  mock-bacen-spi:
    build:
      context: ../..
      dockerfile: services/mock-bacen-spi/Dockerfile
    image: platinumcoin/mock-bacen-spi
    container_name: mock-bacen-spi
    ports:
      - "9090:9090"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # The boot values of the dial; POST /admin/config moves them while the stack runs, which is the only
      # way to express a drill like "fail the next five attempts" (docs/local-dev.md §5.5).
      BACEN_LATENCY_MS: "2000"          # the real SPI settles within 10s; 2s keeps a demo honest but brisk
      BACEN_FAILURE_RATE: "0.0"         # fraction answered 503, recording NOTHING (transient ⇒ retryable)
      BACEN_TIMEOUT_RATE: "0.0"         # fraction that SETTLE and then hang — the query-before-retry case
      BACEN_TIMEOUT_HANG_MS: "15000"    # must exceed the client's 12s timeout (step 31) to mean anything
      # ── Inbound delivery (step 37): the ONE direction where this stub is the caller ────────────────
      # POST /simulate/inbound-pix presents a payment to settlement-service's webhook. There is NO
      # depends_on for it, deliberately: settlement-service already gates on this stub being healthy, so
      # a dependency back would be a cycle compose refuses to start. The base URL is resolved per call,
      # not at boot, so the stub comes up fine on its own and a delivery before settlement is ready just
      # retries.
      SETTLEMENT_BASE_URL: http://settlement-service:8086
      # Must match settlement-service's SPI_WEBHOOK_TOKEN. A mismatch shows up as 422 INBOUND_REFUSED
      # (the participant answered 401) — the threat-model boundary doing its job, not a bug.
      SPI_WEBHOOK_TOKEN: dev-only-inbound-webhook-token-change-me
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # settlement-service — the SPI connector (Sprint 6, step 31), and the first service in the stack that
  # nobody calls: it long-polls settlement-queue and scales with queue depth rather than user traffic
  # (ADR-0006). It publishes no HTTP business endpoint, so the only port exposed is the actuator one the
  # healthcheck probes. Copies the auth-service "service in compose" block, and gates startup on both the
  # emulator (queue + tables) and the rail it settles against.

  # settlement-service — the SPI connector (Sprint 6, step 31), and the first service in the stack that
  # nobody calls: it long-polls settlement-queue and scales with queue depth rather than user traffic
  # (ADR-0006). It publishes no HTTP business endpoint, so the only port exposed is the actuator one the
  # healthcheck probes. Copies the auth-service "service in compose" block, and gates startup on both the
  # emulator (queue + tables) and the rail it settles against.
  settlement-service:
    build:
      context: ../..
      dockerfile: services/settlement-service/Dockerfile
    image: platinumcoin/settlement-service
    container_name: settlement-service
    ports:
      - "8086:8086"
    environment:
      # ── Error-budget tunables (step 72, ADR-0021) ────────────────────────────────────────────
      # Surfaced here — with the application.yml defaults as the fallback — so a DRILL can tighten the
      # objective from the shell and watch a burn-rate rule fire and resolve, without a rebuild and
      # without editing a number in Java. That is the whole reason AlertProperties exists (step 44); a
      # knob that only lives in application.yml is a knob no operator can reach in a container.
      # See docs/local-dev.md §5.9.1 for the drill these four make possible.
      ALERTS_LATENCY_OBJECTIVE: "${ALERTS_LATENCY_OBJECTIVE:-0.99}"
      ALERTS_FAST_BURN_FACTOR: "${ALERTS_FAST_BURN_FACTOR:-14.4}"
      ALERTS_SLOW_BURN_FACTOR: "${ALERTS_SLOW_BURN_FACTOR:-6}"
      ALERTS_BURN_MINIMUM_REQUESTS: "${ALERTS_BURN_MINIMUM_REQUESTS:-20}"
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Must match auth-service's JWT_SECRET. No token authenticates anything here — the inbound webhook
      # of step 37 is JWT-exempt (BACEN holds no PlatinumCoin token) and guarded by SPI_WEBHOOK_TOKEN
      # instead — but the platform keeps ONE authentication posture rather than a per-service opt-out,
      # and this service mints its own service token for the ledger call (step 33) with this secret.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # The shared secret mock-bacen presents on POST /v1/inbound/pix as X-Webhook-Token (step 37). The
      # route CREDITS MONEY, so it is never anonymous: without this, any process that can reach port 8086
      # could mint spendable balance (threat model, boundary B4). Must match mock-bacen-spi's value; a
      # sandbox stand-in for the production posture (mTLS + BACEN message signing).
      SPI_WEBHOOK_TOKEN: dev-only-inbound-webhook-token-change-me
      # PlatinumCoin's participant id, sent to the rail as the debtor participant. Same value
      # payment-service bakes into every endToEndId.
      PIX_ISPB: "12345678"
      # Where an external send parks money and where an inbound Pix draws it from (step 37). MUST be the
      # identical id payment-service uses, or the two directions stop netting against one balance.
      PIX_CLEARING_ACCOUNT_ID: SPI_CLEARING
      # How many sub-accounts that clearing position is spread over (step 52). ONE variable for the
      # whole stack: payment-service assigns shards, settlement-service assigns them on arrivals,
      # ledger-service sums them, and the seed script creates them — four readers of one number,
      # because a disagreement parks money in an account nobody else sums. `1` is the un-sharded
      # baseline (docs/sharding-findings.md).
      CLEARING_SHARDS: ${CLEARING_SHARDS:-16}
      # account-service's DICT, called by the inbound flow to turn the destination key into the account
      # to credit. Reached by service name on the shared network.
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8082
      # The rail this service settles against. 12s read timeout (ADR-0003): above BACEN's 10s, below the
      # queue's 30s visibility timeout — a longer budget would let a hung call hold a message past its
      # visibility window and have SQS redeliver work still in progress.
      BACEN_BASE_URL: http://mock-bacen-spi:9090
      # ledger-service, called on a definitive outcome (step 33): CLEARING_RELEASE on settlement, the
      # compensating reversal on a permanent refusal. Reached by service name on the shared network.
      LEDGER_BASE_URL: http://ledger-service:8085
      # The alert watchdog's metric source (step 44). Deliberately NOT a depends_on: the watchdog is the
      # one component here allowed to have a soft dependency — if Prometheus is down its rules report
      # SKIPPED and nothing else in this service notices. Gating settlement (which moves money) on the
      # monitoring stack being up would invert exactly the wrong priority.
      PROMETHEUS_URL: http://prometheus:9090
      # Reach LocalStack (SQS + S3) by service name on the shared network. S3 joins in step 43: this
      # service is the platform's audit writer, appending every event as JSON lines to pix-audit-log.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      # Read ONLY under the `local` profile below — the placeholder pair LocalStack needs to derive its
      # account id, never authentication (ADR-0013).
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # ADR-0013 (step 45): an AWS client is pointed at the emulator by the `local` profile and by
      # NOTHING else — without it the SDK's DefaultCredentialsProvider chain looks for an ambient role,
      # finds none here, and the service fails loudly at startup instead of quietly reaching LocalStack
      # while looking configured for production. If you export SPRING_PROFILES_ACTIVE yourself, INCLUDE
      # local (e.g. `json-logs,local`) — see docs/local-dev.md §3.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      # Hard dependency, unlike most: this service resolves its queue URL at startup and consumes from it,
      # so a not-yet-ready emulator means a service that boots healthy while consuming nothing.
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # The rail itself. Not a correctness requirement (an unreachable SPI leaves the message on the queue
      # for redelivery, which is exactly the designed behaviour) — gating here just means the first
      # external send in a demo settles immediately instead of after a retry.
      mock-bacen-spi:
        condition: service_healthy
      # ledger-service, needed to finalize a definitive outcome (step 33): CLEARING_RELEASE or the
      # compensating reversal, and the PIX_IN credit of an inbound Pix (step 37). Also not a correctness
      # requirement — a ledger outage leaves the message for redelivery (the -rel/-rev/in- txId makes the
      # retry a replay) and answers the inbound webhook 503 so the rail re-presents — but gating means
      # both directions work the moment settlement starts.
      ledger-service:
        condition: service_healthy
      # account-service, whose DICT the inbound flow resolves the destination key against (step 37). Not
      # a correctness requirement either: an unreachable directory answers the webhook 503 + Retry-After,
      # which re-presents the payment rather than bouncing it.
      account-service:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # notification-service — the real-time push service (step 38), and the platform's first
  # long-lived-connection service: it holds one SSE stream per connected customer and feeds them from
  # notification-queue. Nothing depends on it: a missed push degrades UX, never correctness, because
  # every outcome stays queryable on GET /payments/{id}.

  # notification-service — the real-time push service (step 38), and the platform's first
  # long-lived-connection service: it holds one SSE stream per connected customer and feeds them from
  # notification-queue. Nothing depends on it: a missed push degrades UX, never correctness, because
  # every outcome stays queryable on GET /payments/{id}.
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: platinumcoin/notification-service
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      # ── Tracing (step 72, ADR-0021) ──────────────────────────────────────────────────────────
      # The only two things a DEPLOYMENT gets to decide about tracing; every policy — the sampler, the
      # span-to-log join, the queue propagation — is inherited from common-lib and configured nowhere
      # else (ADR-0021: no service wires tracing itself).
      # The application speaks OTLP and nothing else; where the spans are stored is the collector's
      # business, which is what makes the backend swappable without touching a service.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # 1.0 in the sandbox: seeing every trace is the point of a sandbox, and at this volume the cost is
      # nothing. A load profile turns it down to a production-shaped ratio and measures the send path
      # THERE — a load test run with tracing off would measure a system nobody operates, and one run at
      # 1.0 would measure the tracing. Failures are kept whatever this says (AsymmetricSampler).
      # `load/k6/run.sh` sets TRACING_SAMPLING_PROBABILITY for its measured runs and restores it after
      # (step 47); everything else gets 1.0 by simply not setting it.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Must match auth-service's JWT_SECRET. This service only VALIDATES tokens — the SSE route is
      # fully protected, and the ?access_token= handshake a browser's EventSource needs is resolved by
      # rewriting the parameter into an Authorization header before the shared filter runs, never by
      # putting the path on the public allow-list (see infra/security/SseTokenHandshakeFilter).
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach LocalStack (SQS — notification-queue) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md). This
      # service touches exactly ONE table there — pix_processed_events, the shared consumer-dedup gate.
      # It reads no ledger, no transaction and no account: everything it needs to route and display an
      # event already travels in the event.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      # Read ONLY under the `local` profile below — the placeholder pair LocalStack needs to derive its
      # account id, never authentication (ADR-0013).
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # ADR-0013 (step 45): an AWS client is pointed at the emulator by the `local` profile and by
      # NOTHING else — without it the SDK's DefaultCredentialsProvider chain looks for an ambient role,
      # finds none here, and the service fails loudly at startup instead of quietly reaching LocalStack
      # while looking configured for production. If you export SPRING_PROFILES_ACTIVE yourself, INCLUDE
      # local (e.g. `json-logs,local`) — see docs/local-dev.md §3.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      # Hard dependencies, like settlement's: this service resolves its queue URL at startup and dedupes
      # against DynamoDB, so a not-yet-ready emulator means a service that boots healthy while pushing
      # nothing at all.
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis — its own container (ADR-0008), the local stand-in for ElastiCache for Redis, which LocalStack
  # does NOT emulate. Comes up in Sprint 5 because fraud is the first flow that needs it (velocity
  # counters); since step 40 it also holds the balance cache — payment-service reads and writes
  # `balance:<accountId>` (TTL 5s) and ledger-service deletes those keys after each posting. Data is ephemeral (a cache): no named
  # volume, and `down -v` starts it clean. Version pinned (not `latest`) for reproducible local runs.

# Declared in every file of the set so each one is a valid compose model on its own; the `include`
# in ../docker-compose.yml merges them into the single pix-net the whole stack shares.
networks:
  pix-net:
    name: pix-net
    driver: bridge
