# PlatinumCoin Pix — local stack (docker-compose).
#
# Vertical delivery (PLAN.md): this file grows one flow at a time. Sprint 1 boots only
# auth-service — no AWS/LocalStack/Redis yet, because login → JWT needs none of it.
# Later sprints add localstack, redis, mock-bacen-spi, the other services, etc.
#
# ── "Service in compose" pattern — LATER SERVICES COPY THIS BLOCK ─────────────
#   build.context: ..            → repo root, so the Dockerfile sees target jars & common-lib
#   build.dockerfile: <path>     → the service's own Dockerfile
#   networks: [pix-net]          → shared bridge; services reach each other by name
#   healthcheck → /actuator/health → the contract compose (and the runbook) depend on;
#     `depends_on: condition: service_healthy` in later services gates startup on it.
#   Prereq: `mvn clean package` must have built the jars before `docker compose build`.
# ──────────────────────────────────────────────────────────────────────────────
services:
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    image: platinumcoin/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      # HS256 shared secret (>= 32 bytes). Dev-only value; a real deployment injects a managed
      # secret. Every service that later VALIDATES tokens must share this exact value.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
    networks:
      - pix-net
    healthcheck:
      # amazoncorretto:21 ships /usr/bin/curl; hit the readiness group so the container
      # is only "healthy" once the app can actually serve, not merely once the JVM is up.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # account-service — first service to read DynamoDB (Sprint 2). Copies the auth-service
  # "service in compose" block, and additionally gates startup on LocalStack being healthy
  # (depends_on: service_healthy) since it reads pix_accounts. AWS_ENDPOINT_URL points at the
  # localstack container by name on pix-net.
  account-service:
    build:
      context: ..
      dockerfile: services/account-service/Dockerfile
    image: platinumcoin/account-service
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      # Must match auth-service's JWT_SECRET — account-service only validates tokens.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach LocalStack (SNS/SQS — account-service uses neither today, kept for parity with the other
      # services' AwsProperties shape) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # mock-bacen-spi plays BACEN's DICT: a Pix key NOT registered locally is delegated to
      # GET /spi/dict/{key} (step 30), which is what makes bob@otherbank.com resolve and the external
      # send branch reachable. No bearer token is forwarded on this hop — BACEN is outside our trust
      # domain. Unreachable/slow ⇒ 503 DIRECTORY_UNAVAILABLE, never a misleading 404.
      BACEN_BASE_URL: http://mock-bacen-spi:9090
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # Local-dev convenience only, NOT a correctness requirement: internal keys resolve with the SPI
      # down, and an external lookup fails closed per request (503 + Retry-After) rather than poisoning
      # the service. Gating startup here just means the first external send in a demo works immediately.
      mock-bacen-spi:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ledger-service — the heart (Sprint 3). The ONLY writer of pix_ledger (ADR-0006); step 13
  # ships the read half, a strongly-consistent balance read. Same block as account-service:
  # it also reads DynamoDB, so it gates startup on LocalStack being healthy — and, since the
  # seed of the money supply runs in LocalStack's ready.d, `service_healthy` is what guarantees
  # the balances exist before the first read.
  ledger-service:
    build:
      context: ..
      dockerfile: services/ledger-service/Dockerfile
    image: platinumcoin/ledger-service
    container_name: ledger-service
    ports:
      - "8085:8085"
    environment:
      # Must match auth-service's JWT_SECRET — ledger-service only validates tokens. Every one of
      # its endpoints is authenticated (/internal/** is not on jwt.public-paths).
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach LocalStack (SNS/SQS — ledger-service uses neither today, kept for parity with the other
      # services' AwsProperties shape) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # payment-service — the send-Pix entry point (Sprint 4). The one endpoint an end user reaches to
  # move money. Step 18 ships the walking skeleton of POST /v1/payments/pix (persist RECEIVED, 202).
  # Same block as account-service: it reads/writes DynamoDB (pix_transactions), so it gates startup on
  # LocalStack being healthy — service_healthy guarantees step 17's payment tables exist first.
  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    image: platinumcoin/payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      # Must match auth-service's JWT_SECRET — payment-service only validates tokens. The debtor
      # account is read from the token's accountId claim (Domain Safety Rule #1), never the body.
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # PlatinumCoin's Pix participant id, baked into every endToEndId (E<ISPB><ts><random>).
      PIX_ISPB: "12345678"
      # account-service base URL: payment-service reads the debtor's dailyLimitCents from its
      # internal endpoint before reserving daily-limit headroom (step 20), and resolves the
      # destination Pix key against its DICT seam (step 21). Service name on the shared network;
      # the caller's bearer token is forwarded (ADR-0007).
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8082
      # ledger-service base URL: payment-service commands the atomic debit/credit that settles an
      # internal Pix (step 21). Service name on the shared network; bearer token forwarded.
      LEDGER_SERVICE_BASE_URL: http://ledger-service:8085
      # fraud-service base URL: payment-service scores the send under a hard 200ms budget between the
      # limit check and the debit (step 25). A slow/down fraud-service fails open (SKIPPED), so this is
      # a soft dependency at runtime; the URL is here so the happy path scores. Bearer token forwarded.
      FRAUD_SERVICE_BASE_URL: http://fraud-service:8083
      # Reach LocalStack (SNS — the outbox publisher) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # The SNS topic the outbox publisher drains into (step 29). Injected rather than looked up by
      # name: a deployed service is granted sns:Publish on exactly this ARN and may not list topics
      # (ADR-0013). This is the ARN 06-messaging-core.sh's `create-topic` returns in LocalStack.
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:pix-events
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # The daily-limit check + key resolution call account-service; gate startup on it being
      # healthy so the first send doesn't race a not-yet-ready dependency.
      account-service:
        condition: service_healthy
      # The internal send debits via ledger-service; gate startup on it being healthy too (step 21).
      ledger-service:
        condition: service_healthy
      # fraud-service is a SOFT dependency (fail-open, ADR-0005): payment sends fine at runtime even if
      # it is down. Gating startup on its health here is local-dev convenience only — so the happy path
      # scores immediately — not a correctness requirement. The fail-open is proven at runtime by
      # `docker compose stop fraud-service` after boot: the send still returns 202, flagged SKIPPED.
      fraud-service:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # fraud-service — synchronous fraud scoring in the send path (Sprint 5). Step 23 ships the skeleton:
  # JWT-validating, Redis-connected, health-reporting, no business endpoint yet (POST /score is step 24).
  # Copies the auth-service "service in compose" block; it reads Redis (velocity counters), not DynamoDB,
  # so it gates startup on `redis` being healthy rather than LocalStack.
  fraud-service:
    build:
      context: ..
      dockerfile: services/fraud-service/Dockerfile
    image: platinumcoin/fraud-service
    container_name: fraud-service
    ports:
      - "8083:8083"
    environment:
      # Must match auth-service's JWT_SECRET — fraud-service only validates tokens (step 25 forwards the
      # caller's bearer token to it).
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # Reach Redis by service name on the shared network (velocity counters; ADR-0008 ElastiCache stand-in).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      # The scoring flow (step 24) reads/writes Redis; gate startup on it being healthy.
      redis:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # mock-bacen-spi — the controllable external dependency (Sprint 6, step 30). Two roles in one stub: the
  # SPI rail (POST /spi/settlements, idempotent by endToEndId, with runtime-armable latency / failure /
  # timeout injection) and the DICT (GET /spi/dict/{key}), which is what finally lets an external key
  # resolve. Copies the auth-service "service in compose" block; it depends on nothing at all — no AWS, no
  # Redis, no token — because it is deliberately outside PlatinumCoin (a real participant would reach it
  # over mTLS with an ICP-Brasil certificate). Settlements are held IN MEMORY: restarting this container
  # wipes BACEN's memory, which is a useful drill rather than a defect.
  mock-bacen-spi:
    build:
      context: ..
      dockerfile: services/mock-bacen-spi/Dockerfile
    image: platinumcoin/mock-bacen-spi
    container_name: mock-bacen-spi
    ports:
      - "9090:9090"
    environment:
      # The boot values of the dial; POST /admin/config moves them while the stack runs, which is the only
      # way to express a drill like "fail the next five attempts" (docs/local-dev.md §5.5).
      BACEN_LATENCY_MS: "2000"          # the real SPI settles within 10s; 2s keeps a demo honest but brisk
      BACEN_FAILURE_RATE: "0.0"         # fraction answered 503, recording NOTHING (transient ⇒ retryable)
      BACEN_TIMEOUT_RATE: "0.0"         # fraction that SETTLE and then hang — the query-before-retry case
      BACEN_TIMEOUT_HANG_MS: "15000"    # must exceed the client's 12s timeout (step 31) to mean anything
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # settlement-service — the SPI connector (Sprint 6, step 31), and the first service in the stack that
  # nobody calls: it long-polls settlement-queue and scales with queue depth rather than user traffic
  # (ADR-0006). It publishes no HTTP business endpoint, so the only port exposed is the actuator one the
  # healthcheck probes. Copies the auth-service "service in compose" block, and gates startup on both the
  # emulator (queue + tables) and the rail it settles against.
  settlement-service:
    build:
      context: ..
      dockerfile: services/settlement-service/Dockerfile
    image: platinumcoin/settlement-service
    container_name: settlement-service
    ports:
      - "8086:8086"
    environment:
      # Must match auth-service's JWT_SECRET. Nothing is authenticated here yet — the platform keeps ONE
      # authentication posture rather than a per-service opt-out, and step 37 gives this service its first
      # HTTP endpoint (inbound Pix).
      JWT_SECRET: dev-only-hs256-secret-change-me-please-32b
      # PlatinumCoin's participant id, sent to the rail as the debtor participant. Same value
      # payment-service bakes into every endToEndId.
      PIX_ISPB: "12345678"
      # The rail this service settles against. 12s read timeout (ADR-0003): above BACEN's 10s, below the
      # queue's 30s visibility timeout — a longer budget would let a hung call hold a message past its
      # visibility window and have SQS redeliver work still in progress.
      BACEN_BASE_URL: http://mock-bacen-spi:9090
      # ledger-service, called on a definitive outcome (step 33): CLEARING_RELEASE on settlement, the
      # compensating reversal on a permanent refusal. Reached by service name on the shared network.
      LEDGER_BASE_URL: http://ledger-service:8085
      # Reach LocalStack (SQS) by service name on the shared network.
      AWS_ENDPOINT_URL: http://localstack:4566
      # DynamoDB lives in its own standalone container, not LocalStack (docs/load/BOTTLENECK.md) —
      # see AwsProperties#dynamoDbEndpointUrl.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      # Hard dependency, unlike most: this service resolves its queue URL at startup and consumes from it,
      # so a not-yet-ready emulator means a service that boots healthy while consuming nothing.
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
      # The rail itself. Not a correctness requirement (an unreachable SPI leaves the message on the queue
      # for redelivery, which is exactly the designed behaviour) — gating here just means the first
      # external send in a demo settles immediately instead of after a retry.
      mock-bacen-spi:
        condition: service_healthy
      # ledger-service, needed to finalize a definitive outcome (step 33): CLEARING_RELEASE or the
      # compensating reversal. Also not a correctness requirement — a ledger outage leaves the message
      # for redelivery (the -rel/-rev txId makes the retry a replay) — but gating means finalization
      # works the moment settlement starts consuming.
      ledger-service:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis — its own container (ADR-0008), the local stand-in for ElastiCache for Redis, which LocalStack
  # does NOT emulate. Comes up in Sprint 5 because fraud is the first flow that needs it (velocity
  # counters); Sprint 9's balance cache reuses this same container. Data is ephemeral (a cache): no named
  # volume, and `down -v` starts it clean. Version pinned (not `latest`) for reproducible local runs.
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"          # exposed so a host `redis-cli` / app run outside compose can reach it
    networks:
      - pix-net
    healthcheck:
      # The image ships redis-cli; `PING` returns PONG once the server accepts commands. Gates
      # fraud-service's `depends_on: { redis: { condition: service_healthy } }`.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # dynamodb-local — standalone official DynamoDB Local, split out of LocalStack (docs/load/BOTTLENECK.md).
  # LocalStack's own DynamoDB support proxies every call through an internal Python HTTP client
  # (`SimpleRequestsClient`, a plain `requests.Session`) to the same `DynamoDBLocal.jar` this image runs —
  # but that internal proxy has a fixed connection-pool cap (`requests`' library default, `pool_maxsize=10`)
  # that is NOT exposed via any LocalStack env var, and it was the confirmed throughput ceiling under load
  # (~400 raw ops/s regardless of client concurrency, empirically flat from concurrency 1 through 128 —
  # BOTTLENECK.md RUNG 2's follow-up). Talking to the same jar directly, with no proxy in front of it,
  # removes that ceiling. SNS/SQS stay on LocalStack below — DynamoDB is the only AWS service split out.
  # In-memory mode: this is a dev/load-test stack: nothing here persisted DynamoDB data across a restart
  # even before this split (no volume/PERSISTENCE var was ever set on the old LocalStack-hosted table).
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    networks:
      - pix-net
    healthcheck:
      # This minimal AWS-provided image has no AWS CLI (unlike LocalStack's), only curl. DynamoDB Local
      # answers ANY HTTP request once its listener is up — even an unsigned one, with a 400 — and curl
      # without `-f` exits 0 on any HTTP response, so this just confirms the port is accepting connections.
      # The stronger "are the tables actually created" signal lives on the `localstack` healthcheck below,
      # which (from inside that container, over the shared network) can run real `aws dynamodb` commands
      # against this container once it's up.
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # LocalStack — local AWS emulator (ADR-0001). Vertical discipline: each sprint flips on ONLY the
  # services its flow needs. Sprint 2 (Pix keys) pinned `dynamodb`; Sprint 6 adds `sns,sqs` — the
  # first asynchronous flow, external Pix settlement (step 26). `s3` follows in Sprint 10. DynamoDB
  # itself moved to the standalone `dynamodb-local` container above (docs/load/BOTTLENECK.md) — this
  # container now serves only SNS/SQS, though the DynamoDB-creating ready.d scripts (01-05, 07) still
  # run from here (LocalStack's own init runner), just pointed at the new container's endpoint.
  # SERVICES is enforced, not a hint: calling a service that is not listed answers
  # `501 Service 'sqs' is not enabled`, which is exactly what keeps the discipline honest.
  # The version is pinned (not `latest`) for reproducible local runs.
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566"          # single edge port for every emulated AWS service
    environment:
      SERVICES: sns,sqs      # the messaging backbone (Sprint 6) — DynamoDB now lives in dynamodb-local
      DEBUG: "1"             # verbose logs — this is a dev-only emulator
    volumes:
      # ready.d scripts run once the emulator is ready. Empty in step 06 (no tables yet);
      # step 07 drops the pix_accounts / pix_keys creation scripts here.
      - ./localstack/init:/etc/localstack/init/ready.d
    depends_on:
      # ready.d scripts (01-05, 07) create DynamoDB tables against dynamodb-local as soon as THIS
      # container reports ready — without this, they could race a dynamodb-local that hasn't finished
      # starting yet, and `set -euo pipefail` would abort the whole ready.d run on the first failure.
      dynamodb-local:
        condition: service_healthy
    networks:
      - pix-net
    healthcheck:
      # Two conditions, not one — and the second is the one that matters (step 31).
      #
      # The emulator opens port 4566 and reports UP *before* the ready.d scripts have finished, so a
      # service gated only on the health endpoint can start against an emulator with no tables and no
      # queues. Nothing noticed until settlement-service: every service before it touches AWS lazily, on
      # the first request, by which time init has long finished. A consumer resolves its queue at startup
      # and simply died with `QueueDoesNotExist`.
      #
      # So "healthy" here means "seeded", which is what the rest of the stack actually depends on. The
      # probe asserts a resource created by the LAST init script (07-processed-events.sh) exists —
      # scripts run in lexical order (inside THIS container's init runner, regardless of which endpoint
      # each one targets), so that one existing means all of them ran, including 01-05 against
      # dynamodb-local. The check itself now runs `aws` (not `awslocal`, which is hardcoded to
      # localhost:4566) against `dynamodb-local:8000` — reachable from inside this container over the
      # shared network — since that table now lives there, not here. This mirrors exactly what the
      # Testcontainers harness already does (LocalStackTestBase waits on that script's final log line);
      # compose and the tests now agree on what readiness means.
      #
      # IF YOU ADD A SCRIPT THAT SORTS AFTER 07, MOVE THIS PROBE (and the harness's marker) TO IT.
      # (tools/k6/seed/ deliberately does NOT live here, even though it seeds DynamoDB too: this
      # directory is glob-mounted verbatim into every module's Testcontainers LocalStack container
      # (LocalStackTestBase), so anything dropped here runs on every `mvn verify`, not just load tests.
      # The k6 fixture script is run manually, once, against the already-up compose stack instead.)
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null && AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 aws --endpoint-url=http://dynamodb-local:8000 dynamodb describe-table --table-name pix_processed_events >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  pix-net:
    name: pix-net
    driver: bridge
