# PlatinumCoin Pix — local stack (docker-compose). THE ENTRY POINT.
#
# Everything still starts the same way, and every path in the docs, the READMEs and scripts/ keeps
# working:
#
#   docker compose -f infra/docker-compose.yml up -d --build
#
# WHY THIS FILE IS NOW FOUR
# It had grown to 820 lines holding three unrelated concerns, and the heavy per-block commentary that
# makes it useful to read is exactly what made it impossible to scan. `include:` splits it by concern
# without changing the model one byte — `docker compose config` renders identically before and after,
# which is the check to re-run after touching any of these files.
#
#   compose/platform.yml       the eight Spring Boot services
#   compose/backing.yml        LocalStack (SNS/SQS/S3), dynamodb-local, Redis
#   compose/observability.yml  Prometheus, Grafana, the OTLP collector, Jaeger
#
# `include:` and not `-f a -f b`: an include is part of the model, so a plain `docker compose up` gets
# the whole stack with no flags to remember, while multiple `-f` would put that burden on every command
# in every README (and silently give you a partial stack when somebody forgot one).
#
# WHAT THE SPLIT BUYS BESIDES A SHORTER FILE
# The money path can now run without the monitoring stack — nothing on it depends on Prometheus or the
# collector, and until now that independence was a claim rather than something you could exercise:
#
#   docker compose -f infra/compose/backing.yml -f infra/compose/platform.yml up -d
#
# WHAT DELIBERATELY DID NOT HAPPEN: YAML anchors. Deduplicating build/networks/healthcheck/env behind
# `x-java-service: &svc` would shorten the files and cost the property the header above sells — that a
# service block is readable, and copyable, on its own. Worse, `<<:` does not deep-merge: a service that
# declares its own `environment` REPLACES the anchored one instead of extending it, so a block adding
# one variable would silently lose JWT_SECRET and the AWS_* pair. That is the exact class of
# looks-configured-but-is-not failure ADR-0013 spent a step eliminating.
include:
  - compose/backing.yml
  - compose/platform.yml
  - compose/observability.yml
